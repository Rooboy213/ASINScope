services:
  - type: web
    name: asinscope
    runtime: node
    plan: free
    buildCommand: npx pnpm@9.15.0 install && npx pnpm@9.15.0 run build:prod
    startCommand: npx pnpm@9.15.0 run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RAPIDAPI_HOST
        value: real-time-amazon-data.p.rapidapi.com
