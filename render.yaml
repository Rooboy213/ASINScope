services:
  - type: web
    name: asinscope
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:prod
    startCommand: pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RAPIDAPI_HOST
        value: real-time-amazon-data.p.rapidapi.com
