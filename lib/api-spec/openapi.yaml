openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NumVerify Amazon Growth Agency API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: services
    description: Agency services
  - name: blog
    description: Blog posts and categories
  - name: testimonials
    description: Client testimonials
  - name: faq
    description: Frequently asked questions
  - name: caseStudies
    description: Case studies
  - name: pricing
    description: Pricing plans
  - name: contact
    description: Contact form
  - name: newsletter
    description: Newsletter subscriptions
  - name: rankTracker
    description: Amazon product keyword rank tracking
  - name: dashboard
    description: Client dashboard
  - name: admin
    description: Admin panel

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new client account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Services ────────────────────────────────────────────────────
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: Services list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found

  # ─── Blog ─────────────────────────────────────────────────────────
  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Blog posts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostList"
    post:
      operationId: createBlogPost
      tags: [blog]
      summary: Create blog post (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found

  /blog/posts/{id}/update:
    patch:
      operationId: updateBlogPost
      tags: [blog]
      summary: Update blog post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /blog/posts/{id}/delete:
    delete:
      operationId: deleteBlogPost
      tags: [blog]
      summary: Delete blog post (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /blog/categories:
    get:
      operationId: listBlogCategories
      tags: [blog]
      summary: List blog categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogCategory"

  # ─── Testimonials ────────────────────────────────────────────────
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [testimonials]
      summary: Create testimonial (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /testimonials/{id}:
    delete:
      operationId: deleteTestimonial
      tags: [testimonials]
      summary: Delete testimonial (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── FAQ ──────────────────────────────────────────────────────────
  /faq:
    get:
      operationId: listFaq
      tags: [faq]
      summary: List FAQ items
      responses:
        "200":
          description: FAQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqItem"
    post:
      operationId: createFaqItem
      tags: [faq]
      summary: Create FAQ item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaqItem"

  /faq/{id}:
    patch:
      operationId: updateFaqItem
      tags: [faq]
      summary: Update FAQ item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaqItem"
    delete:
      operationId: deleteFaqItem
      tags: [faq]
      summary: Delete FAQ item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Case Studies ────────────────────────────────────────────────
  /case-studies:
    get:
      operationId: listCaseStudies
      tags: [caseStudies]
      summary: List case studies
      responses:
        "200":
          description: Case studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseStudy"

  /case-studies/{id}:
    get:
      operationId: getCaseStudy
      tags: [caseStudies]
      summary: Get case study
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudy"
        "404":
          description: Not found

  # ─── Pricing ──────────────────────────────────────────────────────
  /pricing/plans:
    get:
      operationId: listPricingPlans
      tags: [pricing]
      summary: List pricing plans
      responses:
        "200":
          description: Pricing plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingPlan"

  # ─── Contact ──────────────────────────────────────────────────────
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Newsletter ───────────────────────────────────────────────────
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── Stats (public wow endpoint) ─────────────────────────────────
  /stats:
    get:
      operationId: getSiteStats
      tags: [services]
      summary: Get site statistics for hero section
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

  # ─── Amazon Rank Tracker ──────────────────────────────────────────
  /rank-tracker/lookup:
    post:
      operationId: lookupRankTracker
      tags: [rankTracker]
      summary: Look up an Amazon product keyword ranking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankTrackerInput"
      responses:
        "200":
          description: Rank tracker result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankTrackerResult"
        "400":
          description: Validation error
        "502":
          description: Rank provider unavailable

  # ─── Client Dashboard ─────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get client dashboard summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/projects:
    get:
      operationId: listDashboardProjects
      tags: [dashboard]
      summary: List client projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /dashboard/orders:
    get:
      operationId: listDashboardOrders
      tags: [dashboard]
      summary: List client orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /dashboard/invoices:
    get:
      operationId: listDashboardInvoices
      tags: [dashboard]
      summary: List client invoices
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /dashboard/tickets:
    get:
      operationId: listDashboardTickets
      tags: [dashboard]
      summary: List support tickets
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [dashboard]
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /dashboard/messages:
    get:
      operationId: listDashboardMessages
      tags: [dashboard]
      summary: List messages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /dashboard/reports:
    get:
      operationId: listDashboardReports
      tags: [dashboard]
      summary: List reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  # ─── Admin Panel ──────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin analytics stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/clients:
    get:
      operationId: listAdminClients
      tags: [admin]
      summary: List all clients
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/tickets:
    get:
      operationId: listAdminTickets
      tags: [admin]
      summary: List all support tickets
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /admin/tickets/{id}/reply:
    post:
      operationId: replyToTicket
      tags: [admin]
      summary: Reply to a support ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketReplyInput"
      responses:
        "200":
          description: Replied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /admin/reports:
    post:
      operationId: uploadReport
      tags: [admin]
      summary: Upload report for client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /admin/contacts:
    get:
      operationId: listAdminContacts
      tags: [admin]
      summary: List contact form submissions
      responses:
        "200":
          description: Contact submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactSubmission"

  /admin/newsletter-subscribers:
    get:
      operationId: listNewsletterSubscribers
      tags: [admin]
      summary: List newsletter subscribers
      responses:
        "200":
          description: Subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsletterSubscriber"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth ──────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [client, admin]
        company:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, email, name, role, createdAt]

    RegisterInput:
      type: object
      properties:
        email:
          type: string

        password:
          type: string
          minLength: 8
        name:
          type: string
        company:
          type: string
      required: [email, password, name]

    LoginInput:
      type: object
      properties:
        email:
          type: string

        password:
          type: string
      required: [email, password]

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string

      required: [email]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    # ── Services ──────────────────────────────────────────────────
    Service:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        featured:
          type: boolean
        sortOrder:
          type: integer
      required: [id, title, description, icon, category, featured, sortOrder]

    # ── Blog ──────────────────────────────────────────────────────
    BlogPost:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImageUrl:
          type: ["string", "null"]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        authorName:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        published:
          type: boolean
        readTimeMinutes:
          type: integer
        publishedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, title, slug, excerpt, content, category, tags, authorName, published, readTimeMinutes, createdAt]

    BlogPostList:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/BlogPost"
        total:
          type: integer
      required: [posts, total]

    BlogPostInput:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImageUrl:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        authorName:
          type: string
        readTimeMinutes:
          type: integer
        published:
          type: boolean
      required: [title, slug, excerpt, content, category, authorName, readTimeMinutes]

    BlogPostUpdate:
      type: object
      properties:
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImageUrl:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean
        readTimeMinutes:
          type: integer

    BlogCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        postCount:
          type: integer
      required: [id, name, slug, postCount]

    # ── Testimonials ──────────────────────────────────────────────
    Testimonial:
      type: object
      properties:
        id:
          type: integer
        clientName:
          type: string
        clientTitle:
          type: string
        company:
          type: string
        avatarUrl:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        rating:
          type: integer
        text:
          type: string
        metrics:
          type: ["string", "null"]
        featured:
          type: boolean
      required: [id, clientName, clientTitle, company, rating, text, featured]

    TestimonialInput:
      type: object
      properties:
        clientName:
          type: string
        clientTitle:
          type: string
        company:
          type: string
        avatarUrl:
          type: string
        logoUrl:
          type: string
        rating:
          type: integer
        text:
          type: string
        metrics:
          type: string
        featured:
          type: boolean
      required: [clientName, clientTitle, company, rating, text]

    # ── FAQ ───────────────────────────────────────────────────────
    FaqItem:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
      required: [id, question, answer, category, sortOrder]

    FaqInput:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
      required: [question, answer, category]

    FaqUpdate:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        category:
          type: string
        sortOrder:
          type: integer

    # ── Case Studies ──────────────────────────────────────────────
    CaseStudy:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        clientName:
          type: string
        industry:
          type: string
        challenge:
          type: string
        solution:
          type: string
        results:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/CaseStudyMetric"
        imageUrl:
          type: ["string", "null"]
        timelineMonths:
          type: integer
        featured:
          type: boolean
        createdAt:
          type: string
      required: [id, title, clientName, industry, challenge, solution, results, metrics, timelineMonths, featured, createdAt]

    CaseStudyMetric:
      type: object
      properties:
        label:
          type: string
        before:
          type: string
        after:
          type: string
        improvement:
